[platformio]
default_envs = esp32

[common]
lib_deps =
    acme/RegistrySensor@^1.2.0
    https://github.com/example/GitDisplay.git#v2.0.0
    symlink://lib/LocalControl

[env]
platform = espressif32@6.8.1
framework = arduino

[env:esp32]
lib_deps = ${common.lib_deps}

[env:debug]
extends = env:esp32
lib_deps =
    ${common.lib_deps}
    acme/DebugLog@3.1.0
