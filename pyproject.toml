[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fw-sbom"
version = "0.1.1"
description = "Offline SBOMs for PlatformIO and Arduino CLI firmware projects"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "tests/schemas/LICENSE-CycloneDX", "src/fw_sbom/data/NOTICE"]
readme = "README.md"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.23,<5"]

[project.scripts]
fw-sbom = "fw_sbom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fw_sbom = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
